<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>酸素解離曲線 - 生徒用シミュレーター</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Zen+Old+Mincho:wght@600;900&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'Plus Jakarta Sans', 'Zen Kaku Gothic New', -apple-system, sans-serif;
    background-color: #f8fafc;
    color: #0f172a;
  }

  /* ガラスモーフィズム風カード */
  .glass-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    border: 1px solid #e2e8f0;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.04), 0 8px 10px -6px rgba(15, 23, 42, 0.02);
  }

  /* トラックバウンスアニメーション */
  @keyframes truckBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-2.5px); }
  }
  .truck-moving {
    animation: truckBounce 0.22s ease-in-out infinite;
  }

  /* 酸素（O₂）バブル積み下ろしアニメーション */
  @keyframes loadBubble {
    0% { opacity: 0; transform: translate(-8px, -18px) scale(0.4); }
    50% { opacity: 1; }
    100% { opacity: 0; transform: translate(0px, 0px) scale(1); }
  }

  @keyframes unloadBubble {
    0% { opacity: 1; transform: translate(0px, 0px) scale(1); }
    50% { opacity: 0.8; }
    100% { opacity: 0; transform: translate(12px, 20px) scale(0.3); }
  }

  .particle-bubble {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 9999px;
    color: white;
    font-size: 9px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 20;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .particle-load {
    background: #10b981;
    animation: loadBubble 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
  }

  .particle-unload {
    background: #f97316;
    animation: unloadBubble 0.75s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
  }

  /* 血管内を流れる血流パルス */
  .blood-flow-path {
    stroke-dasharray: 6, 8;
    animation: flowDashForward 0.7s linear infinite;
  }
  .blood-flow-stopped {
    animation-play-state: paused !important;
    opacity: 0.25;
  }

  @keyframes flowDashForward {
    from { stroke-dashoffset: 28; }
    to { stroke-dashoffset: 0; }
  }
</style>
</head>
<body class="min-h-screen py-6 px-4 md:px-8">

<div class="max-w-6xl mx-auto space-y-6">

<script>
// --- グラフ演算関数とデータ ---
var Ay = [0, 24.4, 56.4, 74.4, 83.8, 89.0, 92.1, 94.1, 95.4, 96.3, 97.0];
var By = [0, 6.9, 22.9, 40.0, 54.2, 64.9, 72.7, 78.4, 82.6, 85.7, 88.1];

function interp(arr, x) {
  var clampedX = Math.max(0, Math.min(100, x));
  var idx = clampedX / 10;
  var i0 = Math.floor(idx);
  var i1 = Math.min(arr.length - 1, Math.ceil(idx));
  if (i0 === i1) return arr[i0];
  var t = idx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * t;
}

function xPos(x) {
  return 40 + (x / 100) * 260;
}

function yPos(s) {
  return 180 - (s / 100) * 160;
}

// --- グラフクリック・インタラクション ---
function setClickTrucksPrecision(pct, color) {
  var container = document.getElementById('click-trucks');
  if (!container) return;
  container.innerHTML = '';
  for (var i = 0; i < 10; i++) {
    var fill = Math.max(0, Math.min(100, (pct - i * 10) * 10));
    var box = document.createElement('div');
    box.className = 'w-5 h-5 rounded border border-slate-300 text-[8px] font-bold flex items-center justify-center';
    if (fill > 0) {
      box.style.background = 'linear-gradient(to right, ' + color + ' ' + fill + '%, transparent ' + fill + '%)';
      box.style.borderColor = color;
      box.style.color = fill >= 50 ? '#ffffff' : color;
      box.textContent = 'O₂';
    } else {
      box.style.background = 'transparent';
      box.style.borderColor = '#cbd5e1';
      box.style.color = 'transparent';
    }
    container.appendChild(box);
  }
}

var studentGraph = document.getElementById('graph');
if (studentGraph) {
  studentGraph.addEventListener('click', function(evt) {
    var pt = studentGraph.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    var loc = pt.matrixTransform(studentGraph.getScreenCTM().inverse());
    var xClamp = Math.max(40, Math.min(300, loc.x));
    var yClamp = Math.max(20, Math.min(180, loc.y));
    var xVal = (xClamp - 40) / 260 * 100;
    var clickS = (180 - yClamp) / 160 * 100;
    var Sa = interp(Ay, xVal);
    var Sb = interp(By, xVal);
    var chosen, color, label;

    if (Math.abs(clickS - Sa) <= Math.abs(clickS - Sb)) {
      chosen = Sa; color = '#10b981'; label = 'CO₂ 40 曲線';
    } else {
      chosen = Sb; color = '#f97316'; label = 'CO₂ 60 曲線';
    }

    var mx = xPos(xVal), my = yPos(chosen);
    document.getElementById('pick-marker').setAttribute('cx', mx);
    document.getElementById('pick-marker').setAttribute('cy', my);
    document.getElementById('pick-marker').setAttribute('fill', color);
    document.getElementById('pick-marker').setAttribute('opacity', 1);

    document.getElementById('pick-x').setAttribute('x1', mx);
    document.getElementById('pick-x').setAttribute('x2', mx);
    document.getElementById('pick-x').setAttribute('y1', my);
    document.getElementById('pick-x').setAttribute('y2', 180);
    document.getElementById('pick-x').setAttribute('opacity', 1);

    document.getElementById('pick-y').setAttribute('x1', 40);
    document.getElementById('pick-y').setAttribute('x2', mx);
    document.getElementById('pick-y').setAttribute('y1', my);
    document.getElementById('pick-y').setAttribute('y2', my);
    document.getElementById('pick-y').setAttribute('opacity', 1);

    var integerPercent = Math.round(chosen);
    document.getElementById('pick-readout').innerHTML = '酸素濃度 <span class="font-black text-slate-800">' + Math.round(xVal) + '</span> → 割合 <span class="font-black" style="color:' + color + ';">' + integerPercent + '%</span> （' + label + '）';
    setClickTrucksPrecision(chosen, color);
  });
}

// --- 生徒用クイズ ---
var correctAnswer = { A: '肺胞', B: '組織' };
var hints = {
  A: 'ヒント：二酸化炭素を出してCO₂濃度が低く（40）、酸素濃度が高い環境だよ。トラックが「酸素を多く積み込む」場所はどちらかな？',
  B: 'ヒント：細胞が代謝でCO₂を多く発生させている（60）環境だよ。トラックが「酸素を放出して届ける」場所はどちらかな？'
};

document.querySelectorAll('.quiz-btn').forEach(function(qbtn) {
  qbtn.addEventListener('click', function() {
    var point = qbtn.getAttribute('data-point');
    var choice = qbtn.getAttribute('data-choice');
    var fb = document.getElementById('feedback-' + point);
    if (choice === correctAnswer[point]) {
      fb.textContent = '正解です！（' + choice + '）';
      fb.className = 'text-xs pl-5 font-bold text-emerald-600';
      document.getElementById('label-' + point).textContent = choice;
      document.querySelectorAll('[data-point="' + point + '"]').forEach(function(b) { b.disabled = true; b.className += ' opacity-50 cursor-not-allowed'; });
    } else {
      fb.textContent = hints[point];
      fb.className = 'text-xs pl-5 font-medium text-amber-600';
    }
  });
});

var quizResetBtn = document.getElementById('quiz-reset-btn');
if (quizResetBtn) {
  quizResetBtn.addEventListener('click', function() {
    document.getElementById('label-A').textContent = '点A';
    document.getElementById('label-B').textContent = '点B';
    document.getElementById('feedback-A').textContent = '';
    document.getElementById('feedback-B').textContent = '';
    document.querySelectorAll('.quiz-btn').forEach(function(b) { 
      b.disabled = false; 
      b.className = 'quiz-btn px-3 py-1 rounded-lg border border-slate-200 text-xs font-bold hover:bg-slate-50 active:scale-95 transition-all';
    });
  });
}

// --- 生徒用トラックシミュレーション ---
var bubbleContainer = document.getElementById('bubbles');
var bubbles = [];
if (bubbleContainer) {
  for (var i = 0; i < 10; i++) {
    var b = document.createElement('div');
    b.className = 'w-6 h-6 rounded-md border border-slate-300 text-[9px] font-black flex items-center justify-center transition-colors duration-100';
    bubbleContainer.appendChild(b);
    bubbles.push(b);
  }
}

function setBubblesLinear(pct, color) {
  for (var i = 0; i < 10; i++) {
    if (!bubbles[i]) continue;
    var fill = Math.max(0, Math.min(100, (pct - i * 10) * 10));
    if (fill > 0) {
      bubbles[i].style.background = 'linear-gradient(to right, ' + color + ' ' + fill + '%, transparent ' + fill + '%)';
      bubbles[i].style.borderColor = color;
      bubbles[i].style.color = fill >= 50 ? '#ffffff' : color;
      bubbles[i].textContent = 'O₂';
    } else {
      bubbles[i].style.background = 'transparent';
      bubbles[i].style.borderColor = '#cbd5e1';
      bubbles[i].style.color = 'transparent';
      bubbles[i].textContent = '';
    }
  }
}
setBubblesLinear(97, '#10b981');

var atLung = true;
var animating = false;
var particleContainer = document.getElementById('particle-container');
var cargoGroup = document.getElementById('cargo-o2-group');

function spawnParticle(type) {
  if (!particleContainer) return;
  var p = document.createElement('div');
  p.className = 'particle-bubble ' + (type === 'load' ? 'particle-load' : 'particle-unload');
  p.textContent = 'O₂';
  var truckElem = document.getElementById('truck');
  var leftPos = truckElem ? truckElem.offsetLeft : 0;
  p.style.left = (leftPos + (type === 'load' ? 6 : 18)) + 'px';
  p.style.top = type === 'load' ? '6px' : '10px';
  particleContainer.appendChild(p);
  setTimeout(function() { if (p.parentNode) p.parentNode.removeChild(p); }, 750);
}

function setBloodFlowActive(active, isToLung) {
  var pArt = document.getElementById('flow-p-art');
  var pVein = document.getElementById('flow-p-vein');
  var aorta = document.getElementById('flow-aorta');
  var vena = document.getElementById('flow-vena');

  if (!pArt || !pVein || !aorta || !vena) return;

  if (active) {
    if (!isToLung) {
      aorta.classList.remove('blood-flow-stopped');
      pVein.classList.remove('blood-flow-stopped');
    } else {
      vena.classList.remove('blood-flow-stopped');
      pArt.classList.remove('blood-flow-stopped');
    }
  } else {
    pArt.classList.add('blood-flow-stopped');
    pVein.classList.add('blood-flow-stopped');
    aorta.classList.add('blood-flow-stopped');
    vena.classList.add('blood-flow-stopped');
  }
}

var goBtn = document.getElementById('go-btn');
var truck = document.getElementById('truck');
var truckSvg = document.getElementById('truck-icon-svg');
var truckBody = document.getElementById('truck-body');
var statusEl = document.getElementById('status-el');

if (goBtn) {
  goBtn.addEventListener('click', function() {
    if (animating) return;
    animating = true;
    goBtn.disabled = true;
    truck.classList.add('truck-moving');
    
    var toLung = !atLung;
    setBloodFlowActive(true, toLung);

    truckSvg.style.transform = toLung ? 'scaleX(-1)' : 'scaleX(1)';
    truck.style.left = toLung ? '0%' : 'calc(100% - 48px)';
    statusEl.textContent = toLung ? '心臓のポンプで肺胞へ血液が戻っています…' : '心臓のポンプで全身の組織へ血液が向かっています…';

    setTimeout(function() {
      truck.classList.remove('truck-moving');
      setBloodFlowActive(false, toLung);
      
      var startPct = toLung ? 40 : 97;
      var endPct = toLung ? 97 : 40;
      var transferDuration = 1500;
      var transferStart = null;
      var lastParticleTime = 0;

      statusEl.textContent = toLung ? '肺胞に到着！ 酸素を積み込み中（Hb + O₂ → HbO₂）' : '組織に到着！ 酸素を放出中（HbO₂ → Hb + O₂）';

      function transferStep(timestamp) {
        if (!transferStart) transferStart = timestamp;
        var elapsed = timestamp - transferStart;
        var progress = Math.min(elapsed / transferDuration, 1);

        if (progress < 0.95 && elapsed - lastParticleTime > 180) {
          spawnParticle(toLung ? 'load' : 'unload');
          lastParticleTime = elapsed;
        }

        var currentPct = startPct + (endPct - startPct) * progress;
        var currentColor = currentPct > 68 ? '#10b981' : (currentPct > 50 ? '#eab308' : '#f97316');

        setBubblesLinear(currentPct, currentColor);
        if (cargoGroup) cargoGroup.style.opacity = Math.max(0.1, currentPct / 100);
        if (truckBody) truckBody.setAttribute('fill', currentColor);

        if (progress < 1) {
          requestAnimationFrame(transferStep);
        } else {
          atLung = toLung;
          animating = false;
          goBtn.disabled = false;
          
          if (atLung) {
            statusEl.textContent = '肺胞で酸素の積み込み完了！（割合: 97%）';
            goBtn.innerHTML = '<span>組織へ出発</span><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>';
          } else {
            statusEl.textContent = '組織で酸素を放出し終わりました！（割合: 40%）';
            goBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg><span>肺胞へ戻る</span>';
          }
        }
      }

      requestAnimationFrame(transferStep);
    }, 1600);
  });
}
</script>
